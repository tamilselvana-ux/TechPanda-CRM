{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied - TechPanda CRM</title>
  <link rel="stylesheet" href="{% static 'css/crm.css' %}">
</head>
<body style="background: var(--bg-body); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: var(--font-family);">
  <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); padding: 40px; max-width: 420px; text-align: center;">
    <div style="margin-bottom: 16px;">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    </div>
    <h1 style="font-size: 1.35rem; color: var(--text-main); margin: 0 0 8px;">Access Denied</h1>
    <p style="color: var(--text-muted); font-size: 0.925rem; margin: 0 0 24px;">
      You do not have permission to view this page.
    </p>
    <a href="{% url 'login_redirect' %}" class="btn btn-primary" style="display: inline-block; text-decoration: none;">Back to Dashboard</a>
  </div>
</body>
</html>
