{% load static %}
<!-- Shared Universal Calendar Drawer Component (iTechPanda CRM) -->
<div id="calendar-drawer-backdrop" class="cd-backdrop" aria-hidden="true"></div>

<aside id="calendar-drawer" class="cd-drawer" role="dialog" aria-modal="true" aria-labelledby="cd-drawer-title" aria-hidden="true" tabindex="-1">
  <!-- Mobile Drag / Dismiss Handle -->
  <div class="cd-pull-handle" aria-hidden="true"></div>

  <!-- Drawer Header -->
  <div class="cd-header">
    <div class="cd-header-info">
      <div class="cd-header-top">
        <h2 id="cd-drawer-title" class="cd-title">Filter by Date Range</h2>
        <span id="cd-active-range-pill" class="cd-range-pill" title="Currently active filter range">All Time</span>
      </div>
      <p class="cd-subtitle">Select a quick preset, choose a calendar date range, or type dates directly.</p>
    </div>
    <button type="button" class="cd-close-btn" id="cd-close-btn" aria-label="Close calendar drawer" title="Close (Escape)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- Presets Strip -->
  <div class="cd-presets-wrapper">
    <div class="cd-presets-scroll" role="radiogroup" aria-label="Date Range Presets">
      <button type="button" class="cd-preset-pill" data-preset="today">Today</button>
      <button type="button" class="cd-preset-pill" data-preset="yesterday">Yesterday</button>
      <button type="button" class="cd-preset-pill" data-preset="last_7_days">Last 7 Days</button>
      <button type="button" class="cd-preset-pill" data-preset="last_30_days">Last 30 Days</button>
      <button type="button" class="cd-preset-pill" data-preset="this_month">This Month</button>
      <button type="button" class="cd-preset-pill" data-preset="last_month">Last Month</button>
      <button type="button" class="cd-preset-pill" data-preset="this_fy">This FY</button>
      <button type="button" class="cd-preset-pill" data-preset="custom">Custom Range</button>
    </div>
  </div>

  <!-- Manual Inputs & Quick Summary -->
  <div class="cd-inputs-section">
    <div class="cd-inputs-grid">
      <div class="cd-input-group">
        <label for="cd-start-input" class="cd-input-label">Start Date</label>
        <div class="cd-input-box">
          <svg class="cd-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <input type="date" id="cd-start-input" class="cd-date-input" placeholder="YYYY-MM-DD" autocomplete="off" />
        </div>
      </div>
      <div class="cd-input-separator" aria-hidden="true">→</div>
      <div class="cd-input-group">
        <label for="cd-end-input" class="cd-input-label">End Date</label>
        <div class="cd-input-box">
          <svg class="cd-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <input type="date" id="cd-end-input" class="cd-date-input" placeholder="YYYY-MM-DD" autocomplete="off" />
        </div>
      </div>
    </div>
    <!-- Inline Validation Alert (Hidden by default) -->
    <div id="cd-error-alert" class="cd-error-alert" role="alert" style="display: none;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span id="cd-error-text">Start date cannot be after End date.</span>
    </div>
  </div>

  <!-- Calendar Multi-Month Body -->
  <div class="cd-body">
    <!-- Month Navigation Bar -->
    <div class="cd-nav-bar">
      <button type="button" class="cd-nav-arrow" id="cd-prev-month" aria-label="Previous month" title="Previous Month">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <div class="cd-month-headers-row" id="cd-month-headers">
        <!-- Injected dynamically via JS: Month titles (e.g. October 2026, November 2026) -->
      </div>
      <button type="button" class="cd-nav-arrow" id="cd-next-month" aria-label="Next month" title="Next Month">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>

    <!-- Calendar Months Grids Container -->
    <div class="cd-months-grid" id="cd-months-container">
      <!-- Injected dynamically: 1 month on mobile, 2 months on desktop -->
    </div>
  </div>

  <!-- Sticky Drawer Footer -->
  <div class="cd-footer">
    <button type="button" class="cd-btn cd-btn-clear" id="cd-clear-btn" title="Remove date filters">
      Clear Filter
    </button>
    <div class="cd-footer-right">
      <button type="button" class="cd-btn cd-btn-cancel" id="cd-cancel-btn">
        Cancel
      </button>
      <button type="button" class="cd-btn cd-btn-apply" id="cd-apply-btn">
        Apply Range
      </button>
    </div>
  </div>
</aside>
