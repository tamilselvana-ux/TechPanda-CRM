<!-- Universal User Delete Confirmation Modal -->
<div id="universalUserDeleteModal" class="modal-backdrop tp-modal-overlay" style="display: none; position: fixed !important; inset: 0 !important; width: 100vw !important; height: 100vh !important; background: rgba(15, 23, 42, 0.65) !important; backdrop-filter: blur(4px) !important; -webkit-backdrop-filter: blur(4px) !important; z-index: 1080 !important; align-items: center !important; justify-content: center !important; padding: 20px; box-sizing: border-box;" onclick="handleUniversalDeleteBackdrop(event)">
  <div class="tp-modal-card" style="background: #ffffff !important; color: #1e293b !important; border-radius: 14px !important; width: 100% !important; max-width: 480px !important; text-align: left !important; padding: 24px !important; border: 1px solid #fee2e2 !important; box-shadow: 0 25px 35px -5px rgba(0,0,0,0.3) !important; box-sizing: border-box;" onclick="event.stopPropagation();">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #e2e8f0;">
      <h3 style="margin: 0; font-size: 1.15rem; font-weight: 700; color: #1e293b; display: flex; align-items: center; gap: 8px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        Confirm Delete User
      </h3>
      <button type="button" onclick="closeUniversalDeleteModal()" style="background: none; border: none; font-size: 1.4rem; line-height: 1; cursor: pointer; color: #64748b; padding: 0 4px;" aria-label="Close">&times;</button>
    </div>

    <p style="font-size: 0.95rem; color: #334155; margin: 0 0 16px 0; font-weight: 500;">
      Are you sure you want to delete this user account?
    </p>

    <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 14px 16px; margin-bottom: 16px;">
      <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
        <span style="color: #64748b; font-size: 0.85rem;">Name:</span>
        <strong id="uDelModalName" style="color: #1e293b; font-size: 0.9rem;">-</strong>
      </div>
      <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
        <span style="color: #64748b; font-size: 0.85rem;">Login ID:</span>
        <span id="uDelModalLoginId" style="font-family: monospace; font-weight: 600; color: #0284c7;">-</span>
      </div>
      <div style="display: flex; justify-content: space-between;">
        <span style="color: #64748b; font-size: 0.85rem;">Role:</span>
        <span id="uDelModalRole" class="badge" style="background: #e0e7ff; color: #4338ca; font-weight: 600; font-size: 0.75rem; padding: 2px 8px; border-radius: 4px;">-</span>
      </div>
    </div>

    <div style="background: #fffbeb; border: 1px solid #fef3c7; border-radius: 8px; padding: 12px 14px; margin-bottom: 20px; display: flex; gap: 10px; align-items: flex-start;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" style="flex-shrink: 0; margin-top: 1px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="17"></line></svg>
      <span style="font-size: 0.82rem; color: #92400e; font-weight: 500; line-height: 1.4;">
        The user will no longer be able to log in. Any assigned leads will be preserved and safely marked as Unassigned.
      </span>
    </div>

    <form id="universalUserDeleteForm" method="POST" action="" style="display: flex; justify-content: flex-end; gap: 10px; margin: 0;">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      <button type="button" class="btn btn-secondary" onclick="closeUniversalDeleteModal()">Cancel</button>
      <button type="submit" class="btn btn-danger" style="background: #dc2626; color: #fff; font-weight: 700; border: none; padding: 8px 18px; border-radius: 8px;">Delete Account</button>
    </form>
  </div>
</div>

<script>
function openUniversalDeleteModal(userId, name, loginId, role) {
  const modal = document.getElementById('universalUserDeleteModal');
  const form = document.getElementById('universalUserDeleteForm');
  const nameEl = document.getElementById('uDelModalName');
  const loginIdEl = document.getElementById('uDelModalLoginId');
  const roleEl = document.getElementById('uDelModalRole');

  if (!modal || !form) return;

  form.action = `/admin/users/${userId}/delete/`;
  if (nameEl) nameEl.textContent = name;
  if (loginIdEl) loginIdEl.textContent = '@' + loginId;
  if (roleEl) roleEl.textContent = role || 'Staff';

  modal.classList.add('active');
  modal.style.setProperty('display', 'flex', 'important');
}

function closeUniversalDeleteModal() {
  const modal = document.getElementById('universalUserDeleteModal');
  if (!modal) return;
  modal.classList.remove('active');
  modal.style.setProperty('display', 'none', 'important');
}

function handleUniversalDeleteBackdrop(event) {
  if (event.target === document.getElementById('universalUserDeleteModal')) {
    closeUniversalDeleteModal();
  }
}

document.addEventListener('keydown', function(event) {
  if (event.key === 'Escape') {
    closeUniversalDeleteModal();
  }
});
</script>
