{# Reusable User Actions Toolbar: [Resend Invite] [Leads] [Profile] [Edit] [Password] [Delete] #}
<div class="user-action-buttons-group" style="display: inline-flex; gap: 6px; align-items: center; justify-content: flex-end; white-space: nowrap;">
  <!-- 1. Resend Invite -->
  <a href="{% url 'resend_user_invitation' target_user.pk %}"
     class="tp-action-btn tp-action-invite"
     style="background: #ffffff; color: #1e293b; border: 1px solid #cbd5e1; font-weight: 600; padding: 4px 10px; border-radius: 8px; font-size: 0.78rem; text-decoration: none; box-shadow: 0 1px 2px rgba(0,0,0,0.05); display: inline-flex; align-items: center;"
     title="Resend Welcome Email &amp; Setup Link">
    Resend Invite
  </a>

  <!-- 2. Leads -->
  <a href="{% url 'universal_user_leads' target_user.pk %}"
     class="tp-action-btn tp-action-leads"
     style="background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%); color: #ffffff; border: none; font-weight: 700; padding: 4px 12px; border-radius: 8px; font-size: 0.78rem; text-decoration: none; box-shadow: 0 2px 6px rgba(37,99,235,0.35); display: inline-flex; align-items: center;"
     title="View Assigned Leads">
    Leads
  </a>

  <!-- 3. Profile -->
  <a href="{% url 'universal_user_profile' target_user.pk %}"
     class="tp-action-btn tp-action-profile"
     style="background: #ffffff; color: #1e293b; border: 1px solid #cbd5e1; font-weight: 600; padding: 4px 10px; border-radius: 8px; font-size: 0.78rem; text-decoration: none; box-shadow: 0 1px 2px rgba(0,0,0,0.05); display: inline-flex; align-items: center;"
     title="View Profile Details">
    Profile
  </a>

  <!-- 4. Edit -->
  <a href="{% url 'admin_user_edit' target_user.pk %}?next={{ next_url|default:request.path }}"
     class="tp-action-btn tp-action-edit"
     style="background: #ffffff; color: #1e293b; border: 1px solid #cbd5e1; font-weight: 600; padding: 4px 10px; border-radius: 8px; font-size: 0.78rem; text-decoration: none; box-shadow: 0 1px 2px rgba(0,0,0,0.05); display: inline-flex; align-items: center;"
     title="Edit User">
    Edit
  </a>

  <!-- 5. Password -->
  <a href="{% url 'admin_set_user_password' target_user.pk %}?next={{ next_url|default:request.path }}"
     class="tp-action-btn tp-action-password"
     style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: #ffffff; border: none; font-weight: 700; padding: 4px 10px; border-radius: 8px; font-size: 0.78rem; text-decoration: none; box-shadow: 0 2px 6px rgba(217,119,6,0.3); display: inline-flex; align-items: center;"
     title="Set / Reset Password">
    Password
  </a>

  <!-- 6. Delete -->
  {% if request.user.pk != target_user.pk %}
  <button type="button"
          class="tp-action-btn tp-action-delete"
          style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: #ffffff; border: none; font-weight: 700; padding: 4px 10px; border-radius: 8px; font-size: 0.78rem; cursor: pointer; box-shadow: 0 2px 6px rgba(220,38,38,0.3); display: inline-flex; align-items: center;"
          onclick="openUniversalDeleteModal('{{ target_user.pk }}', '{{ target_user.get_full_name|default:target_user.username|escapejs }}', '{{ target_user.username|escapejs }}', '{{ target_user.get_role_display|escapejs }}')"
          title="Delete User">
    Delete
  </button>
  {% endif %}
</div>
